[package]
name = "really_fast_api"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "High-performance, production-ready Rust web framework!"

[[bin]]
name = "really_fast_api"
path = "src/bin/cli.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
matchit = "0.9.2"
serde_urlencoded = "0.7"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "chrono"] }
dotenvy = "0.15" 
inventory = "0.3"
really_fast_api_macros = { path = "./really_fast_api_macros" }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }

[profile.release]
opt-level = 3          
codegen-units = 1     
lto = "fat"            
panic = "abort"        
strip = true